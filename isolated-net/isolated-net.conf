# Configuration of the isolated NAT network.
#
# deploy.py reads this file, resolves the "auto" values and stores the result
# in /etc/pve/isolated-net.conf, which is shared by every cluster node and read
# by isolated-net-agent. Once the network exists, the SDN configuration is the
# source of truth for the subnets: re-running deploy.py never renumbers it.

# SDN zone and vnet ids: lowercase letters and digits, max 8 characters.
# Guests attach to the vnet like to any bridge (bridge=<VNET>).
ZONE=isolated
VNET=isonet
VNET_ALIAS="Isolated NAT network (internet only)"

# IPv4 subnet in CIDR notation, or "auto" to take the first /SUBNET4_AUTO_PREFIX_LEN
# starting at 10.100.0.0 that overlaps nothing routed on the nodes or in SDN.
SUBNET4=auto
SUBNET4_AUTO_PREFIX_LEN=22

# IPv6 subnet in CIDR notation, or "auto" to generate a random RFC 4193
# unique local /48 and use its subnet 1 as a /64. Being ULA, it does not
# depend on (and survives changes of) the prefix your ISP delegates.
SUBNET6=auto

# DNS server announced via DHCP (one address per family). Empty means the
# vnet gateway, where the SDN dnsmasq forwards queries to the node's resolvers.
DNS4=
DNS6=

# Besides every non-default route of the node, block the enclosing /N of each
# on-link global IPv6 prefix, i.e. the rest of your ISP delegation.
# 48 covers /48 and /56 delegations; 0 disables it.
SITE_PREFIX_LEN6=48

# Additional destinations guests must never reach (comma or space separated).
EXTRA_BLOCKED=
